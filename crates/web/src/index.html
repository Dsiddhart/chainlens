<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chain Lens - Bitcoin Transaction Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 30px;
        }
        
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat {
            background: #f7f7f7;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: #333;
            font-size: 24px;
            font-weight: 700;
        }
        
        .io-section {
            margin: 30px 0;
        }
        
        .io-section h3 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .io-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .io-item code {
            background: #e8e8e8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c33;
        }
        
        .hidden {
            display: none;
        }
        
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
        }
        
        .toggle {
            color: #667eea;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
            margin-top: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⛓️ Chain Lens</h1>
        
        <div class="card">
            <h2>Analyze Transaction</h2>
            <p style="color: #666; margin: 10px 0 20px;">Paste your transaction fixture JSON below:</p>
            
            <textarea id="fixtureInput" placeholder='{"network":"mainnet","raw_tx":"...","prevouts":[...]}'></textarea>
            
            <button id="analyzeBtn" onclick="analyzeTransaction()">🔍 Analyze Transaction</button>
        </div>
        
        <div id="result" class="card hidden">
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        async function analyzeTransaction() {
            const btn = document.getElementById('analyzeBtn');
            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');
            const input = document.getElementById('fixtureInput').value.trim();
            
            if (!input) {
                alert('Please paste a transaction fixture');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '⏳ Analyzing...';
            resultDiv.classList.add('hidden');
            
            try {
                const fixture = JSON.parse(input);
                
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        raw_tx: fixture.raw_tx,
                        prevouts: fixture.prevouts || []
                    })
                });
                
                const data = await response.json();
                
                if (data.ok === false) {
                    throw new Error(data.error.message);
                }
                
                displayResult(data);
                resultDiv.classList.remove('hidden');
                
            } catch (err) {
                resultContent.innerHTML = `<div class="error">❌ Error: ${err.message}</div>`;
                resultDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 Analyze Transaction';
            }
        }
        
        function displayResult(tx) {
            const html = `
                <h2>✅ Transaction Analysis</h2>
                
                <div class="summary">
                    <div class="stat">
                        <div class="stat-label">Transaction ID</div>
                        <div class="stat-value" style="font-size: 14px; word-break: break-all;">${tx.txid.substring(0, 16)}...</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Fee</div>
                        <div class="stat-value">${tx.fee_sats} sats</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Fee Rate</div>
                        <div class="stat-value">${tx.fee_rate_sat_vb.toFixed(2)} sat/vB</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Type</div>
                        <div class="stat-value">${tx.segwit ? 'SegWit' : 'Legacy'}</div>
                    </div>
                </div>
                
                <div class="io-section">
                    <h3>📥 Inputs (${tx.vin.length})</h3>
                    ${tx.vin.map((input, i) => `
                        <div class="io-item">
                            <strong>Input ${i}:</strong> ${input.prevout.value_sats} sats<br>
                            <code>${input.script_type}</code>
                            ${input.address ? `<br>From: <code>${input.address}</code>` : ''}
                        </div>
                    `).join('')}
                </div>
                
                <div class="io-section">
                    <h3>📤 Outputs (${tx.vout.length})</h3>
                    ${tx.vout.map((output, i) => `
                        <div class="io-item">
                            <strong>Output ${i}:</strong> ${output.value_sats} sats<br>
                            <code>${output.script_type}</code>
                            ${output.address ? `<br>To: <code>${output.address}</code>` : ''}
                        </div>
                    `).join('')}
                </div>
                
                ${tx.warnings.length > 0 ? `
                    <div style="background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 4px solid #ffc107;">
                        <strong>⚠️ Warnings:</strong> ${tx.warnings.map(w => w.code).join(', ')}
                    </div>
                ` : ''}
                
                <div style="margin-top: 20px;">
                    <span class="toggle" onclick="toggleJson()">Show Full JSON</span>
                    <pre id="fullJson" class="hidden">${JSON.stringify(tx, null, 2)}</pre>
                </div>
            `;
            
            document.getElementById('resultContent').innerHTML = html;
        }
        
        function toggleJson() {
            document.getElementById('fullJson').classList.toggle('hidden');
        }
    </script>
</body>
</html>
