[package]
name = "btc-web"
version = "0.1.0"
edition = "2024"

[dependencies]
btc-core ={path = "../core"}
serde_json = "1"
serde = { version = "1", features = ["derive"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }